<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Todo App</title>
  </head>
  <body>
    <div class="grid grid-cols-[300px_1fr] grid-rows-[auto_1fr] min-h-screen" id="app">
    <header class="col-span-3 flex justify-between items-center p-10 bg-gray-700 text-white">
      <div class="flex justify-center text-5xl gap-4">
        <i class="fa-solid fa-clipboard-list"></i>
        <h1>Todo List</h1>
      </div>
    </header>
      <nav class="row-span-1 flex flex-col items-start gap-4 p-6 bg-gray-400 font-medium">
        <div class="flex flex-col items-start w-full">
        <button class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"><i class="fa-solid fa-inbox"></i> Inbox</button>
        <button class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"><i class="fa-solid fa-calendar"></i> Today</button>
        <button class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"><i class="fa-regular fa-calendar"></i> This week</button>
        </div>
        <h1 class="text-3xl font-bold">Projects</h1>
        <div class="flex flex-col items-start w-full">
        <button class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"><i class="fa-solid fa-plus"></i> Add Project</button>
        </div>
      </nav>
      <main class="col-span-2 flex justify-center">
        <h1>Inbox</h1>
      </main>
      <footer class="col-span-3 flex justify-center bg-gray-700 p-2 text-white">copyright</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script src="https://kit.fontawesome.com/f0a76e6894.js" crossorigin="anonymous"></script>
  </body>
</html>
