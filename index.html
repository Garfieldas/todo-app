<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Todo App</title>
  </head>
  <body>
    <div
      class="grid grid-cols-1 md:grid-cols-[300px_1fr] grid-rows-[auto_1fr_auto] min-h-screen relative"
    >
      <header
        class="col-span-full flex justify-between items-center p-10 bg-gray-700 text-white"
      >
        <div
          class="flex md:justify-center justify-between md:text-5xl text-4xl gap-4 w-full"
        >
          <div class="flex gap-2">
            <i class="fa-regular fa-calendar"></i>
            <h1>Todo List</h1>
          </div>
          <button class="block md:hidden cursor-pointer" id="navBtn">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </header>
      <nav
        id="mobileMenu"
        class="hidden md:hidden absolute top-30 left-0 w-[100%] bg-gray-400 p-4 shadow-lg"
      >
        <div class="flex flex-col items-start w-full">
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-solid fa-inbox"></i> Inbox
          </button>
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-solid fa-calendar"></i> Today
          </button>
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-regular fa-calendar"></i> This week
          </button>
        </div>
        <h1 class="text-3xl font-bold">Projects</h1>
        <div class="flex flex-col items-start w-full">
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-solid fa-plus"></i> Add Project
          </button>
        </div>
      </nav>
      <nav
        class="hidden md:flex md:row-start-2 md:col-start-1 flex-col items-start gap-4 p-6 bg-gray-400 font-medium"
      >
        <div class="flex flex-col items-start w-full">
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-solid fa-inbox"></i> Inbox
          </button>
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-solid fa-calendar"></i> Today
          </button>
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-regular fa-calendar"></i> This week
          </button>
        </div>
        <h1 class="text-3xl font-bold">Projects</h1>
        <div class="flex flex-col items-start w-full">
          <button
            class="py-2.5 px-5 w-full text-left hover:bg-gray-300 cursor-pointer"
          >
            <i class="fa-solid fa-plus"></i> Add Project
          </button>
        </div>
      </nav>
      <main
        class="col-span-full md:col-start-2 md:row-start-2 p-6 flex flex-col items-center"
      >
        <div class="w-full max-w-3xl flex items-center justify-between">
          <h1 class="text-3xl font-bold">Inbox</h1>
          <button id="openTaskBtn"
            class="py-2.5 px-5 rounded-lg hover:bg-gray-200 cursor-pointer"
          >
            <i class="fa-solid fa-plus"></i> Add Task
          </button>
        </div>
        <div class="w-full max-w-3xl mt-6 space-y-4">
          <article
            class="rounded-2xl border border-gray-200 bg-white shadow p-5"
          >
            <header class="flex items-start justify-between gap-4">
              <div>
                <h3 class="text-xl font-semibold">Buy groceries</h3>
                <p class="text-gray-600 mt-1">
                  Milk, eggs, bread, and veggies.
                </p>
              </div>

              <span
                class="shrink-0 rounded-full px-3 py-1 text-sm font-medium bg-yellow-100 text-yellow-800"
              >
                Pending
              </span>
            </header>

            <div
              class="mt-4 flex flex-wrap items-center gap-3 text-sm text-gray-500"
            >
              <span
                ><i class="fa-regular fa-clock"></i> Created: 2025-09-12</span
              >
              <span><i class="fa-solid fa-tag"></i> Project: Personal</span>
            </div>

            <div class="mt-5 flex items-center gap-2">
              <button class="rounded-lg border px-3 py-2 hover:bg-gray-50">
                <i class="fa-solid fa-check"></i> Mark done
              </button>
              <button class="rounded-lg border px-3 py-2 hover:bg-gray-50">
                <i class="fa-regular fa-pen-to-square"></i> Edit
              </button>
              <button class="rounded-lg border px-3 py-2 hover:bg-gray-50">
                <i class="fa-regular fa-trash-can"></i> Delete
              </button>
            </div>
          </article>
        </div>
      </main>
<div
  id="addTaskModal"
  class="hidden fixed inset-0 z-[1000]"
  aria-hidden="true"
>
  <div class="absolute inset-0 bg-black/40"></div>

  <div
    class="absolute inset-0 flex items-start justify-center p-4 md:p-8 overflow-y-auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="addTaskTitle"
  >
    <div
      class="w-full max-w-xl rounded-2xl bg-white shadow-xl border border-gray-200"
    >
      <div class="flex items-center justify-between p-5 border-b">
        <h2 id="addTaskTitle" class="text-xl font-semibold">Add New Task</h2>
        <button
          id="closeAddTaskBtn"
          class="p-2 rounded hover:bg-gray-100"
          aria-label="Close"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="addTaskForm" class="p-5 space-y-4">
        <div>
          <label for="taskName" class="block text-sm font-medium mb-1">Task name *</label>
          <input
            id="taskName"
            name="name"
            type="text"
            required
            class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-gray-700"
            placeholder="e.g., Buy groceries"
          />
        </div>

        <div>
          <label for="taskDesc" class="block text-sm font-medium mb-1">Description</label>
          <textarea
            id="taskDesc"
            name="desc"
            rows="3"
            class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-gray-700"
            placeholder="Optional details…"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label for="taskDue" class="block text-sm font-medium mb-1">Due date</label>
            <input
              id="taskDue"
              name="due"
              type="date"
              class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-gray-700"
            />
          </div>

          <div>
            <label for="taskProject" class="block text-sm font-medium mb-1">Project</label>
            <input
              id="taskProject"
              name="project"
              type="text"
              class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-gray-700"
              placeholder="e.g., Personal"
            />
          </div>
        </div>

        <div class="flex items-center gap-3">
          <input id="taskStatus" name="status" type="checkbox" class="size-4" />
          <label for="taskStatus" class="text-sm">Mark as done</label>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button
            type="button"
            id="cancelAddTaskBtn"
            class="rounded-lg border px-4 py-2 hover:bg-gray-50"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="rounded-lg bg-gray-800 text-white px-4 py-2 hover:bg-gray-700"
          >
            Save Task
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

      <footer
        class="col-span-full flex justify-center gap-1 bg-gray-700 p-2 text-white text-xl"
      >
        <p>
          Copyright &#169;
          <script>
            document.write(new Date().getFullYear());
          </script>
        </p>
        <a href="https://github.com/Garfieldas/todo-app">Grafieldas</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script
      src="https://kit.fontawesome.com/f0a76e6894.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
